# Jekyll Configuration for GitHub Pages
title: "KFrost - Cloud / Software Engineer"
description: "AWS・Terraform・自動化・OSS検証を軸に、設計・構築・運用改善に取り組むクラウド／ソフトウェアエンジニア"
author: "KFrost"
email: ""
baseurl: "/KFrost533"
url: "https://KFrost533.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Jekyll includes directory (for {% include %} tags)
includes_dir: doc/_includes

# Exclude files from processing
exclude:
  - .git/
  - .gitignore
  - README_EN.md
  - vendor/
  - node_modules/

# Navigation
header_pages:
  - doc/Career_JP.md
  - doc/Career_EN.md
  - blog/index.md

# Social media and links
github_username: KFrost533

# Custom variables
show_excerpts: true
date_format: "%Y年%m月%d日"

# Sass configuration
sass:
  sass_dir: _sass
  style: compressed